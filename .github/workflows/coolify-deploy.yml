name: Coolify deploy

# Dispara redeploy no Coolify a cada push pra main.
# Para funcionar voce precisa adicionar 2 secrets no GitHub:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#   Nome:  COOLIFY_DEPLOY_WEBHOOK
#   Valor: URL do webhook (ex: http://31.97.17.85:8000/api/v1/deploy?uuid=XXX&force=false)
#   Nome:  COOLIFY_API_TOKEN
#   Valor: API Token do Coolify com permissao deploy (Keys & Tokens -> API Tokens)
#
# Tambem suporta disparo manual em Actions -> Coolify deploy -> Run workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'supabase/migrations/**'   # migrations rodam no workflow proprio
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

concurrency:
  group: coolify-deploy
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger Coolify redeploy
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" ]; then
            echo "::error::Secret COOLIFY_DEPLOY_WEBHOOK nao configurado (URL ex: http://HOST:8000/api/v1/deploy?uuid=XXX&force=false)."
            echo "Adicione em Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${{ secrets.COOLIFY_API_TOKEN }}" ]; then
            echo "::error::Secret COOLIFY_API_TOKEN nao configurado (Coolify > Keys & Tokens > API Tokens)."
            echo "Adicione em Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Trigger Coolify deploy (API)
        run: |
          HTTP_STATUS=$(curl -sS -o /tmp/body -w "%{http_code}" -X GET \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            -H "Accept: application/json" \
            "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}")
          echo "HTTP $HTTP_STATUS"
          cat /tmp/body
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "::error::Coolify retornou erro $HTTP_STATUS"
            exit 1
          fi

      - name: Summary
        run: |
          echo "## Coolify deploy disparado" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ator: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- mensagem: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
