name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'Ambiente alvo'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

concurrency:
  group: supabase-migrate-${{ github.event.inputs.target || 'dev' }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations (${{ github.event.inputs.target || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'dev' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ github.event.inputs.target == 'prod' && 'ohmnzalkfbhdivtttzsa' || 'urfrxirqkkrosyrvvtdo' }}

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Show pending migrations
        run: supabase migration list --linked

      - name: Apply migrations
        run: supabase db push --linked --include-all
