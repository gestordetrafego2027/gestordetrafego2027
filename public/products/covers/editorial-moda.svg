<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#f5f0e8"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#e0d8cc" stroke-width="1"/>

  <!-- fashion frame lines (asymmetric, editorial) -->
  <line x1="20" y1="100" x2="580" y2="100" stroke="#ede6d8" stroke-width="1"/>
  <line x1="400" y1="100" x2="400" y2="500" stroke="#ede6d8" stroke-width="1"/>
  <line x1="20" y1="500" x2="400" y2="500" stroke="#ede6d8" stroke-width="1"/>

  <!-- inner accent rectangle -->
  <rect x="420" y="120" width="140" height="360" fill="#ece5d6"/>

  <!-- large M letterform -->
  <text x="30" y="470" font-family="Georgia,'Times New Roman',serif" font-size="340" fill="#ede6d8" font-weight="normal">M</text>

  <!-- category label -->
  <text x="40" y="66" font-family="system-ui,-apple-system,sans-serif" font-size="8" letter-spacing="5" fill="#8a7a6a">PRODUTORA</text>
  <line x1="40" y1="78" x2="180" y2="78" stroke="#d8d0c4" stroke-width="1"/>

  <!-- product name -->
  <text x="40" y="560" font-family="Georgia,'Times New Roman',serif" font-size="60" fill="#111" font-weight="normal">Editorial</text>
  <text x="40" y="630" font-family="Georgia,'Times New Roman',serif" font-size="60" fill="#111" font-weight="normal">de Moda</text>

  <!-- sub label -->
  <text x="40" y="668" font-family="system-ui,sans-serif" font-size="8" letter-spacing="4" fill="#a09080">PRODUÇÃO · STYLING · DIREÇÃO</text>

  <!-- bottom brand -->
  <line x1="40" y1="736" x2="560" y2="736" stroke="#ddd6cc" stroke-width="1"/>
  <text x="40" y="756" font-family="system-ui,sans-serif" font-size="8" letter-spacing="5" fill="#c0b8ac">HOUSE MAZZUTTI</text>
  <text x="560" y="756" font-family="sans-serif" font-size="10" fill="#c0b8ac" text-anchor="end">✦</text>
</svg>