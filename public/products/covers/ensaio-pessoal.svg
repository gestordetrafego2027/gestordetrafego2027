<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#f0ede8"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#ddd6cc" stroke-width="1"/>

  <!-- elegant vertical lines -->
  <line x1="480" y1="20" x2="480" y2="580" stroke="#e8e2d8" stroke-width="1"/>
  <line x1="520" y1="20" x2="520" y2="480" stroke="#ece6dc" stroke-width="0.5"/>

  <!-- large italic E letterform (decorative) -->
  <text x="280" y="400" font-family="Georgia,'Times New Roman',serif" font-size="320" fill="#eae6e0" font-weight="normal" font-style="italic">E</text>

  <!-- category label -->
  <text x="40" y="66" font-family="system-ui,-apple-system,sans-serif" font-size="8" letter-spacing="5" fill="#9a8a7a">STUDIO</text>
  <line x1="40" y1="78" x2="140" y2="78" stroke="#d8d0c8" stroke-width="1"/>

  <!-- product name -->
  <text x="40" y="556" font-family="Georgia,'Times New Roman',serif" font-size="60" fill="#111" font-weight="normal">Ensaio</text>
  <text x="40" y="626" font-family="Georgia,'Times New Roman',serif" font-size="60" fill="#111" font-weight="normal">Pessoal</text>

  <!-- sub label -->
  <text x="40" y="664" font-family="system-ui,sans-serif" font-size="8" letter-spacing="4" fill="#b0a090">FOTOGRAFIA AUTORAL</text>

  <!-- bottom brand -->
  <line x1="40" y1="736" x2="560" y2="736" stroke="#ddd6cc" stroke-width="1"/>
  <text x="40" y="756" font-family="system-ui,sans-serif" font-size="8" letter-spacing="5" fill="#c8bfb5">HOUSE MAZZUTTI</text>
  <text x="560" y="756" font-family="sans-serif" font-size="10" fill="#c8bfb5" text-anchor="end">✦</text>
</svg>