<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#0f0f0f"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#1d1d1d" stroke-width="1"/>

  <!-- subtle diagonal grid -->
  <line x1="0" y1="200" x2="600" y2="800" stroke="#161616" stroke-width="1"/>
  <line x1="200" y1="0" x2="600" y2="533" stroke="#161616" stroke-width="1"/>
  <line x1="0" y1="0" x2="600" y2="600" stroke="#161616" stroke-width="0.5"/>

  <!-- category label top -->
  <text x="40" y="66" font-family="system-ui,-apple-system,sans-serif" font-size="8" letter-spacing="5" fill="#5a4a2e">HMZT ACADEMY</text>
  <line x1="40" y1="78" x2="220" y2="78" stroke="#222" stroke-width="1"/>

  <!-- large decorative ✦ -->
  <text x="300" y="320" font-family="sans-serif" font-size="120" fill="#1a1a1a" text-anchor="middle">✦</text>

  <!-- product name -->
  <text x="40" y="502" font-family="Georgia,'Times New Roman',serif" font-size="58" fill="#f0ede8" font-weight="normal">Direção</text>
  <text x="40" y="570" font-family="Georgia,'Times New Roman',serif" font-size="58" fill="#f0ede8" font-weight="normal">Criativa</text>

  <!-- sub label -->
  <text x="40" y="614" font-family="system-ui,sans-serif" font-size="8" letter-spacing="4" fill="#3a3a3a">CURSO ON-LINE</text>

  <!-- bottom brand -->
  <line x1="40" y1="736" x2="560" y2="736" stroke="#1a1a1a" stroke-width="1"/>
  <text x="40" y="756" font-family="system-ui,sans-serif" font-size="8" letter-spacing="5" fill="#2e2e2e">HOUSE MAZZUTTI</text>
  <text x="560" y="756" font-family="sans-serif" font-size="10" fill="#2e2e2e" text-anchor="end">✦</text>
</svg>