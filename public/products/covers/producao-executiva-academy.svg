  <rect x="20" y="340" width="560" height="1" fill="#1a1a1a"/>
  <rect x="20" y="460" width="560" height="60" fill="#161616"/>

  <!-- category label -->
  <text x="40" y="66" font-family="system-ui,-apple-system,sans-serif" font-size="8" letter-spacing="5" fill="#5a4a2e">HMZT ACADEMY</text>
  <line x1="40" y1="78" x2="220" y2="78" stroke="#222" stroke-width="1"/>

  <!-- large number/index -->
  <text x="40" y="340" font-family="Georgia,'Times New Roman',serif" font-size="200" fill="#161616" font-weight="normal">03</text>

  <!-- product name (overlapping band) -->
