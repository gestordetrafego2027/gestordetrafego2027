<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#f5f0e8"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#e0d8cc" stroke-width="1"/>

  <!-- spotlight cones -->
  <polygon points="300,120 120,460 480,460" fill="none" stroke="#e8e0d2" stroke-width="1"/>
  <polygon points="300,140 160,460 440,460" fill="none" stroke="#ece4d6" stroke-width="1"/>
  <polygon points="300,160 200,460 400,460" fill="none" stroke="#ede7d9" stroke-width="0.5"/>
  <!-- stage line -->
  <line x1="80" y1="460" x2="520" y2="460" stroke="#ddd6c8" stroke-width="1.5"/>
  <!-- light source dot -->
  <circle cx="300" cy="120" r="8" fill="#e4dccc"/>
  <circle cx="300" cy="120" r="3" fill="#d8d0c4"/>

  <!-- category label -->
  <text x="40" y="66" font-family="system-ui,-apple-system,sans-serif" font-size="8" letter-spacing="5" fill="#8a7a6a">PRODUTORA</text>
  <line x1="40" y1="78" x2="180" y2="78" stroke="#d8d0c4" stroke-width="1"/>

  <!-- product name -->
  <text x="40" y="536" font-family="Georgia,'Times New Roman',serif" font-size="56" fill="#111" font-weight="normal">Produção</text>
  <text x="40" y="600" font-family="Georgia,'Times New Roman',serif" font-size="56" fill="#6a5a48" font-weight="normal">de Eventos</text>

  <!-- sub label -->
  <text x="40" y="640" font-family="system-ui,sans-serif" font-size="8" letter-spacing="4" fill="#a09080">PRODUÇÃO · CENOGRAFIA · LIVE</text>

  <!-- bottom brand -->
  <line x1="40" y1="736" x2="560" y2="736" stroke="#ddd6cc" stroke-width="1"/>
  <text x="40" y="756" font-family="system-ui,sans-serif" font-size="8" letter-spacing="5" fill="#c0b8ac">HOUSE MAZZUTTI</text>
  <text x="560" y="756" font-family="sans-serif" font-size="10" fill="#c0b8ac" text-anchor="end">✦</text>
</svg>