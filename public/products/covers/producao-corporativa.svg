<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#f5f0e8"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#e0d8cc" stroke-width="1"/>

  <!-- corporate grid motif -->
  <rect x="80"  y="120" width="100" height="100" fill="none" stroke="#e4dccf" stroke-width="1"/>
  <rect x="200" y="120" width="100" height="100" fill="none" stroke="#e4dccf" stroke-width="1"/>
  <rect x="320" y="120" width="100" height="100" fill="none" stroke="#e4dccf" stroke-width="1"/>
  <rect x="440" y="120" width="100" height="100" fill="none" stroke="#e4dccf" stroke-width="1"/>
  <rect x="80"  y="240" width="100" height="100" fill="#ece5d6"/>
  <rect x="200" y="240" width="100" height="100" fill="none" stroke="#e4dccf" stroke-width="1"/>
  <rect x="320" y="240" width="100" height="100" fill="#ece5d6"/>
  <rect x="440" y="240" width="100" height="100" fill="none" stroke="#e4dccf" stroke-width="1"/>
  <rect x="80"  y="360" width="100" height="100" fill="none" stroke="#e4dccf" stroke-width="1"/>
  <rect x="200" y="360" width="100" height="100" fill="#ece5d6"/>
  <rect x="320" y="360" width="100" height="100" fill="none" stroke="#e4dccf" stroke-width="1"/>
  <rect x="440" y="360" width="100" height="100" fill="#ece5d6"/>

  <!-- category label -->
  <text x="40" y="66" font-family="system-ui,-apple-system,sans-serif" font-size="8" letter-spacing="5" fill="#8a7a6a">PRODUTORA</text>
  <line x1="40" y1="78" x2="180" y2="78" stroke="#d8d0c4" stroke-width="1"/>

  <!-- product name -->
  <text x="40" y="530" font-family="Georgia,'Times New Roman',serif" font-size="46" fill="#111" font-weight="normal">Produção</text>
  <text x="40" y="584" font-family="Georgia,'Times New Roman',serif" font-size="46" fill="#111" font-weight="normal">Corporativa</text>
  <text x="40" y="638" font-family="Georgia,'Times New Roman',serif" font-size="46" fill="#6a5a48" font-weight="normal">&amp; Institucional</text>

  <!-- sub label -->
  <text x="40" y="674" font-family="system-ui,sans-serif" font-size="8" letter-spacing="4" fill="#a09080">VÍDEO · FOTO · BRANDING</text>

  <!-- bottom brand -->
  <line x1="40" y1="736" x2="560" y2="736" stroke="#ddd6cc" stroke-width="1"/>
  <text x="40" y="756" font-family="system-ui,sans-serif" font-size="8" letter-spacing="5" fill="#c0b8ac">HOUSE MAZZUTTI</text>
  <text x="560" y="756" font-family="sans-serif" font-size="10" fill="#c0b8ac" text-anchor="end">✦</text>
</svg>