<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#111"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#1e1e1e" stroke-width="1"/>

  <!-- megaphone/broadcast diagonal lines -->
  <line x1="100" y1="20"  x2="580" y2="380" stroke="#161616" stroke-width="1"/>
  <line x1="40"  y1="20"  x2="580" y2="460" stroke="#151515" stroke-width="1"/>
  <line x1="20"  y1="60"  x2="580" y2="560" stroke="#141414" stroke-width="1"/>
  <line x1="20"  y1="160" x2="580" y2="660" stroke="#131313" stroke-width="1"/>
  <line x1="20"  y1="260" x2="500" y2="740" stroke="#121212" stroke-width="1"/>

  <!-- category label -->
  <text x="40" y="66" font-family="system-ui,-apple-system,sans-serif" font-size="8" letter-spacing="5" fill="#4a4a4a">AGÊNCIA</text>
  <line x1="40" y1="78" x2="160" y2="78" stroke="#222" stroke-width="1"/>

  <!-- product name -->
  <text x="40" y="508" font-family="Georgia,'Times New Roman',serif" font-size="56" fill="#f0ede8" font-weight="normal">RP &amp;</text>
  <text x="40" y="572" font-family="Georgia,'Times New Roman',serif" font-size="56" fill="#f0ede8" font-weight="normal">Marketing</text>
  <text x="40" y="636" font-family="Georgia,'Times New Roman',serif" font-size="56" fill="#c8aa80" font-weight="normal">Direto</text>

  <!-- sub label -->
  <text x="40" y="672" font-family="system-ui,sans-serif" font-size="8" letter-spacing="4" fill="#3a3a3a">RELAÇÕES PÚBLICAS · COMUNICAÇÃO</text>

  <!-- bottom brand -->
  <line x1="40" y1="736" x2="560" y2="736" stroke="#1e1e1e" stroke-width="1"/>
  <text x="40" y="756" font-family="system-ui,sans-serif" font-size="8" letter-spacing="5" fill="#2e2e2e">HOUSE MAZZUTTI</text>
  <text x="560" y="756" font-family="sans-serif" font-size="10" fill="#2e2e2e" text-anchor="end">✦</text>
