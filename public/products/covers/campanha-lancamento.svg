  <path d="M 300 540 A 130 130 0 0 1 300 280" fill="none" stroke="#181818" stroke-width="1.5"/>
  <path d="M 300 560 A 190 190 0 0 1 300 180" fill="none" stroke="#161616" stroke-width="1.5"/>
  <path d="M 300 580 A 260 260 0 0 1 300 60"  fill="none" stroke="#141414" stroke-width="1"/>
  <!-- signal dot -->
  <circle cx="300" cy="440" r="6" fill="#2a2a2a"/>
  <circle cx="300" cy="440" r="2" fill="#3a3a3a"/>

  <!-- category label -->
  <text x="40" y="66" font-family="system-ui,-apple-system,sans-serif" font-size="8" letter-spacing="5" fill="#4a4a4a">AGÊNCIA</text>
  <line x1="40" y1="78" x2="160" y2="78" stroke="#222" stroke-width="1"/>

  <!-- product name -->
  <text x="40" y="514" font-family="Georgia,'Times New Roman',serif" font-size="50" fill="#f0ede8" font-weight="normal">Campanha</text>
  <text x="40" y="572" font-family="Georgia,'Times New Roman',serif" font-size="50" fill="#f0ede8" font-weight="normal">de</text>
  <text x="40" y="630" font-family="Georgia,'Times New Roman',serif" font-size="50" fill="#c8aa80" font-weight="normal">Lançamento</text>

