<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#f0ede8"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#ddd6cc" stroke-width="1"/>

  <!-- camera lens circles -->
  <circle cx="300" cy="290" r="190" fill="none" stroke="#e4dfd6" stroke-width="1"/>
  <circle cx="300" cy="290" r="145" fill="none" stroke="#e8e2d8" stroke-width="1"/>
  <circle cx="300" cy="290" r="100" fill="none" stroke="#ddd6cc" stroke-width="1.5"/>
  <circle cx="300" cy="290" r="55" fill="none" stroke="#d8d0c4" stroke-width="1"/>
  <circle cx="300" cy="290" r="18" fill="#ddd6cc"/>

  <!-- aperture blades -->
  <line x1="300" y1="100" x2="300" y2="480" stroke="#e4dfd6" stroke-width="0.5"/>
  <line x1="110" y1="290" x2="490" y2="290" stroke="#e4dfd6" stroke-width="0.5"/>
  <line x1="166" y1="156" x2="434" y2="424" stroke="#e4dfd6" stroke-width="0.5"/>
  <line x1="434" y1="156" x2="166" y2="424" stroke="#e4dfd6" stroke-width="0.5"/>

  <!-- category label -->
  <text x="40" y="66" font-family="system-ui,-apple-system,sans-serif" font-size="8" letter-spacing="5" fill="#9a8a7a">STUDIO</text>
  <line x1="40" y1="78" x2="140" y2="78" stroke="#d8d0c8" stroke-width="1"/>

  <!-- product name -->
  <text x="40" y="556" font-family="Georgia,'Times New Roman',serif" font-size="62" fill="#111" font-weight="normal">Book</text>
  <text x="40" y="626" font-family="Georgia,'Times New Roman',serif" font-size="62" fill="#111" font-weight="normal">Studio</text>

  <!-- sub label -->
  <text x="40" y="664" font-family="system-ui,sans-serif" font-size="8" letter-spacing="4" fill="#b0a090">FOTOGRAFIA DE IMAGEM PESSOAL</text>

  <!-- bottom brand -->
  <line x1="40" y1="736" x2="560" y2="736" stroke="#ddd6cc" stroke-width="1"/>
  <text x="40" y="756" font-family="system-ui,sans-serif" font-size="8" letter-spacing="5" fill="#c8bfb5">HOUSE MAZZUTTI</text>
