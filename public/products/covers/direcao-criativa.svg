<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#f5f0e8"/>
  <rect x="20" y="20" width="560" height="760" fill="none" stroke="#e0d8cc" stroke-width="1"/>

  <!-- arrow/direction motif -->
  <line x1="40" y1="300" x2="560" y2="300" stroke="#e8e0d4" stroke-width="1"/>
  <line x1="40" y1="340" x2="460" y2="340" stroke="#ece4d8" stroke-width="1"/>
  <line x1="40" y1="380" x2="380" y2="380" stroke="#eee8dc" stroke-width="1"/>
  <line x1="40" y1="420" x2="300" y2="420" stroke="#f0eade" stroke-width="1"/>
  <!-- arrowhead -->
  <polygon points="540,290 560,300 540,310" fill="#ddd6c8"/>

  <!-- large compass/star -->
  <line x1="300" y1="100" x2="300" y2="260" stroke="#e4dccc" stroke-width="1.5"/>
  <line x1="220" y1="180" x2="380" y2="180" stroke="#e4dccc" stroke-width="1.5"/>
  <line x1="243" y1="123" x2="357" y2="237" stroke="#e8e0d0" stroke-width="1"/>
  <line x1="357" y1="123" x2="243" y2="237" stroke="#e8e0d0" stroke-width="1"/>
  <circle cx="300" cy="180" r="12" fill="#ddd6c8"/>

  <!-- category label -->
  <text x="40" y="66" font-family="system-ui,-apple-system,sans-serif" font-size="8" letter-spacing="5" fill="#8a7a6a">PRODUTORA</text>
  <line x1="40" y1="78" x2="180" y2="78" stroke="#d8d0c4" stroke-width="1"/>

  <!-- product name -->
  <text x="40" y="504" font-family="Georgia,'Times New Roman',serif" font-size="50" fill="#111" font-weight="normal">Direção &amp;</text>
  <text x="40" y="562" font-family="Georgia,'Times New Roman',serif" font-size="50" fill="#111" font-weight="normal">Criação</text>
  <text x="40" y="620" font-family="Georgia,'Times New Roman',serif" font-size="50" fill="#6a5a48" font-weight="normal">Estratégica</text>

  <!-- sub label -->
  <text x="40" y="658" font-family="system-ui,sans-serif" font-size="8" letter-spacing="4" fill="#a09080">CONCEITO · NARRATIVA · DIREÇÃO</text>

  <!-- bottom brand -->
  <line x1="40" y1="736" x2="560" y2="736" stroke="#ddd6cc" stroke-width="1"/>
  <text x="40" y="756" font-family="system-ui,sans-serif" font-size="8" letter-spacing="5" fill="#c0b8ac">HOUSE MAZZUTTI</text>
  <text x="560" y="756" font-family="sans-serif" font-size="10" fill="#c0b8ac" text-anchor="end">✦</text>
</svg>